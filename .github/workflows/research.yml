# Nghiên cứu nhiều coin với dữ liệu Binance Futures thật (data.binance.vision).
# Chạy khi đẩy lên nhánh claude/** hoặc research/** có sửa research/ hay chiến lược; hoặc bấm Run workflow.
name: research

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Coin, cách nhau bởi dấu cách"
        default: "BTC ETH SOL BNB XRP DOGE ADA LINK AVAX LTC"
      buy:
        description: 'Tham số buy JSON, ví dụ {"htf_trend": true}'
        default: "{}"
  push:
    branches: ["claude/**", "research/**"]
    paths: ["research/**", "user_data/strategies/**", "run_futures.py", ".github/workflows/research.yml"]

jobs:
  multi-coin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: freqtradeorg/freqtrade:stable
      options: --user root
    env:
      PAIRS: ${{ inputs.pairs || 'BTC ETH SOL BNB XRP DOGE ADA LINK AVAX LTC' }}
      BUY: ${{ inputs.buy || '{}' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tải dữ liệu Binance Futures (data.binance.vision)
        run: |
          END=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
          python research/binance_vision.py --pairs $PAIRS --start 2020-10 --end $END --out data/binance
      - name: Backtest từng coin và danh mục
        run: python research/multi_coin.py --pairs $PAIRS --datadir data/binance --timerange 20210101- --buy "$BUY"
      - uses: actions/upload-artifact@v4
        with:
          name: research-result
          path: research_result.md
